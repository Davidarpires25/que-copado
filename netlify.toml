# El proyecto se despliega en Vercel y en Netlify, el mismo repo en los dos.
#
# Las cabeceras de cache NO van aca: viven en `next.config.ts`, que es lo unico
# que leen las dos plataformas. Estuvieron aca un tiempo y en Vercel no las leia
# nadie, asi que los tiles del mapa y los logos se volvian a bajar en cada carga
# de la mitad de los despliegues.
#
# Si hace falta cambiar cuanto dura algo en cache, es en `next.config.ts`.
# Duplicarlo aca es garantizar que en algun momento digan cosas distintas.

[build]
  command = "npm run build"
  publish = ".next"
